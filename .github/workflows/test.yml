name: Connector CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/audit_distribution.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: distribution
          path: dist/
      - run: python -m pip install pytest dist/tasksai_agent_skills-0.3.1-py3-none-any.whl
      - run: python -m pytest -q
      - run: python scripts/verify_clean_install.py --wheel dist/tasksai_agent_skills-0.3.1-py3-none-any.whl --output verification.json
      - name: Also install the source distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python scripts/verify_clean_install.py --wheel dist/tasksai_agent_skills-0.3.1.tar.gz --output verification-source.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: installation-${{ matrix.os }}-${{ matrix.python }}
          path: verification*.json
          if-no-files-found: warn
